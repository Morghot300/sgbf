spring:
  application:
    name: sgbf-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sgbf_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Douala&characterEncoding=utf8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      # Le schema est integralement pilote par Flyway : Hibernate ne doit jamais
      # creer/modifier de tables lui-meme (voir section 20.1 de l'analyse - contraintes
      # CHECK/triggers que ddl-auto ne sait pas exprimer).
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Africa/Douala

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never

app:
  organisation:
    nom: ${APP_ORG_NOM:SNEF Cameroun SA - Groupe SNEF}
  security:
    cors:
      origine-frontend: ${FRONTEND_ORIGIN:http://localhost:5173}
    # Attribut Secure du cookie de rafraichissement : DOIT etre "true" en
    # production (HTTPS obligatoire). Chrome/Edge/Firefox traitent "localhost"
    # comme un contexte securise et acceptent un cookie Secure meme en HTTP
    # local, mais mettre "false" par defaut en dev evite toute mauvaise
    # surprise sur un autre navigateur ou une autre machine de developpement.
    cookie-secure: ${COOKIE_SECURE:false}
    jwt:
      secret: ${JWT_SECRET}
      access-token-ttl-minutes: 15
      refresh-token-ttl-days: 7
  bootstrap:
    admin-email: ${ADMIN_BOOTSTRAP_EMAIL:}
    admin-password: ${ADMIN_BOOTSTRAP_PASSWORD:}

springdoc:
  swagger-ui:
    path: /api/docs
  api-docs:
    path: /api/docs.json

logging:
  level:
    root: INFO
    com.snef.sgbf: INFO
