spring:
  application:
    name: sgbf-backend

  # Profil de repli (evolution du 2026-09-23) : utilise UNIQUEMENT si aucun profil n'est
  # explicitement active ailleurs (JVM -Dspring-boot.run.profiles, variable
  # SPRING_PROFILES_ACTIVE, configuration d'IDE...) - jamais prioritaire sur un choix explicite.
  # Avant cette evolution, lancer l'application sans preciser le profil (bouton "Run" d'un
  # IDE, mvnw spring-boot:run sans argument) retombait sur le profil "default", qui ne charge
  # jamais application-local.yml : ${SGBF_JWT_SECRET} et les autres secrets locaux restaient
  # alors non resolus (echec de demarrage), pour un developpeur qui s'attendait a un
  # environnement local pret a l'emploi. Ce projet n'ayant, a ce stade, aucun environnement de
  # production deploye distinct, faire de "local" le repli par defaut est sans risque ici et
  # elimine cette source recurrente d'echec de demarrage.
  profiles:
    default: local

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sgbf_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Douala&characterEncoding=utf8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      # Le schema est integralement pilote par Flyway : Hibernate ne doit jamais
      # creer/modifier de tables lui-meme (voir section 20.1 de l'analyse - contraintes
      # CHECK/triggers que ddl-auto ne sait pas exprimer).
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Africa/Douala

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never

app:
  organisation:
    nom: ${APP_ORG_NOM:SNEF Cameroun SA - Groupe SNEF}
  security:
    cors:
      origine-frontend: ${FRONTEND_ORIGIN:http://localhost:5173}
    # Attribut Secure du cookie de rafraichissement : DOIT etre "true" en
    # production (HTTPS obligatoire). Chrome/Edge/Firefox traitent "localhost"
    # comme un contexte securise et acceptent un cookie Secure meme en HTTP
    # local, mais mettre "false" par defaut en dev evite toute mauvaise
    # surprise sur un autre navigateur ou une autre machine de developpement.
    cookie-secure: ${COOKIE_SECURE:false}
    jwt:
      # Nom de variable namespace (evolution du 2026-09-23) : un simple "JWT_SECRET"
      # collisionne trop facilement avec une variable d'environnement Windows
      # persistante et non liee a ce projet (deja observe plusieurs fois en
      # developpement local - la valeur de application-local.yml se faisait
      # silencieusement ecraser par une variable systeme de 240 bits, provoquant
      # une WeakKeyException au demarrage). Un nom specifique a l'application
      # evite cette collision sans jamais toucher aux variables d'environnement
      # de la machine.
      secret: ${SGBF_JWT_SECRET}
      access-token-ttl-minutes: 15
      # Pas de duree de vie configuree pour le jeton de rafraichissement : il
      # n'expire plus par ecoulement du temps (evolution du 2026-08-26, tous
      # comptes) - voir RefreshTokenService.
  bootstrap:
    admin-email: ${ADMIN_BOOTSTRAP_EMAIL:}
    admin-password: ${ADMIN_BOOTSTRAP_PASSWORD:}

springdoc:
  swagger-ui:
    path: /api/docs
  api-docs:
    path: /api/docs.json

logging:
  level:
    root: INFO
    com.snef.sgbf: INFO
